[project]
name = "osint-infra-mcp"
version = "0.2.0"
description = "OSINT infrastructure MCP server for Investigators Copilot -- WHOIS, DNS, RDAP, Wayback, plus the shared enrich adapters"
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
